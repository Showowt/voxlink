<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Entrevoz</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #030507;
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { color: #00e5a0; font-size: 20px; margin: 0; }
      p { color: rgba(255, 255, 255, 0.5); font-size: 14px; margin: 0; }
      button {
        margin-top: 12px;
        background: #00e5a0;
        color: #000;
        border: 0;
        font-weight: 700;
        padding: 12px 28px;
        border-radius: 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Entrevoz</h1>
    <p>No connection. / Sin conexión.</p>
    <p>Check your internet and try again. / Revisa tu internet e intenta de nuevo.</p>
    <button onclick="window.location.href='https://www.entrevoz.co/'">Retry / Reintentar</button>
  </body>
</html>
